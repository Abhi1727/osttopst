<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google-site-verification" content="google714b91deb92b0330.html" />
    <meta
      name="description"
      content="Convert OST files to PST format quickly and securely. Professional OST TO PST converter with advanced features and reliable performance."
    />
    <title>OST TO PST Converter - Professional OST to PST File Conversion Tool</title>
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-PKY70YH95X"></script>
    <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-PKY70YH95X');</script>
    <!-- Optimized Non-Blocking Font Loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
      />
    </noscript>
  </head>
  <body>
    <div id="root">
      <!-- Mission-Critical Loading Shell: Prevents white flash and improves FCP -->
      <style>
        .loading-shell {
          position: fixed;
          inset: 0;
          background: #ffffff;
          display: flex;
          flex-direction: column;
          z-index: 9999;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .shell-header {
          height: 72px;
          border-bottom: 1px solid #f1f5f9;
          display: flex;
          align-items: center;
          padding: 0 40px;
          justify-content: space-between;
        }
        .shell-logo {
          width: 150px;
          height: 24px;
          background: #f1f5f9;
          border-radius: 4px;
        }
        .shell-nav {
          display: flex;
          gap: 24px;
        }
        .shell-nav-item {
          width: 60px;
          height: 12px;
          background: #f1f5f9;
          border-radius: 4px;
        }
        .shell-hero {
          flex: 1;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          padding: 40px;
          text-align: center;
        }
        .shell-h1 {
          width: 300px;
          height: 48px;
          background: #f1f5f9;
          border-radius: 8px;
          margin-bottom: 24px;
        }
        .shell-p {
          width: 450px;
          height: 16px;
          background: #f8fafc;
          border-radius: 4px;
          margin-bottom: 48px;
        }
        .shell-uploader {
          width: 100%;
          max-width: 500px;
          height: 300px;
          background: #ffffff;
          border: 2px dashed #e2e8f0;
          border-radius: 32px;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .shell-icon {
          width: 64px;
          height: 64px;
          background: #f8fafc;
          border-radius: 16px;
        }
        @keyframes pulse {
          0%, 100% { opacity: 1; }
          50% { opacity: 0.5; }
        }
        .animate-pulse {
          animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
      </style>
      <div class="loading-shell">
        <div class="shell-header">
          <div class="shell-logo animate-pulse"></div>
          <div class="shell-nav">
            <div class="shell-nav-item animate-pulse"></div>
            <div class="shell-nav-item animate-pulse" style="animation-delay: 0.2s"></div>
            <div class="shell-nav-item animate-pulse" style="animation-delay: 0.4s"></div>
          </div>
        </div>
        <div class="shell-hero">
          <div class="shell-h1 animate-pulse"></div>
          <div class="shell-p animate-pulse" style="animation-delay: 0.3s"></div>
          <div class="shell-uploader animate-pulse" style="animation-delay: 0.6s">
            <div class="shell-icon"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
