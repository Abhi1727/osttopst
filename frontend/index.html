<body>
  <div id="root">
    <!-- Loading Shell: mirrors actual Hero layout to eliminate CLS -->
    <style>
      *{box-sizing:border-box;margin:0;padding:0}
      .ls{position:fixed;inset:0;background:#f0f9ff;display:flex;flex-direction:column;z-index:9999;font-family:"Plus Jakarta Sans",-apple-system,system-ui,sans-serif}
      .ls-hdr{height:64px;border-bottom:1px solid #f1f5f9;background:#fff;display:flex;align-items:center;padding:0 24px;justify-content:space-between;flex-shrink:0}
      .ls-logo{display:flex;align-items:center;gap:10px}
      .ls-logo-icon{width:26px;height:26px;background:#0ea5e9;border-radius:6px}
      .ls-logo-text{width:120px;height:16px;background:#e2e8f0;border-radius:4px}
      .ls-nav{display:flex;gap:20px}
      .ls-nav-item{width:52px;height:11px;background:#e2e8f0;border-radius:4px}
      .ls-hero{flex:1;background:#f0f9ff;padding:8px 12px 32px;display:flex;align-items:center;overflow:hidden}
      .ls-grid{width:100%;max-width:1440px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
      .ls-left{display:flex;flex-direction:column;gap:12px}
      .ls-h1-line{height:28px;background:#cbd5e1;border-radius:6px}
      .ls-p-line{height:13px;background:#e2e8f0;border-radius:4px}
      .ls-badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
      .ls-badge{height:26px;width:136px;background:#e2e8f0;border-radius:6px}
      .ls-card{background:#fff;border-radius:24px;border:1px solid #f1f5f9;box-shadow:0 20px 60px -15px rgba(0,0,0,0.05);padding:32px 24px;display:flex;flex-direction:column;align-items:center;gap:20px;width:100%}
      .ls-icon{width:80px;height:80px;background:#f1f5f9;border-radius:16px}
      .ls-card-title{height:24px;width:200px;background:#e2e8f0;border-radius:6px}
      .ls-btn{width:100%;max-width:320px;height:56px;background:#0ea5e9;border-radius:12px}
      .ls-foot{height:13px;width:200px;background:#e2e8f0;border-radius:4px}
      @keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
      .ap{animation:pulse 1.8s cubic-bezier(.4,0,.6,1) infinite}
      @media(min-width:1024px){
        .ls-hdr{height:72px;padding:0 40px}
        .ls-hero{padding:4px 32px 40px}
        .ls-grid{display:grid;grid-template-columns:1fr 1.3fr;gap:40px;align-items:center}
        .ls-h1-line{height:36px}
        .ls-card{padding:40px}
      }
    </style>
    <div class="ls">
      <div class="ls-hdr">
        <div class="ls-logo">
          <div class="ls-logo-icon ap"></div>
          <div class="ls-logo-text ap"></div>
        </div>
        <div class="ls-nav">
          <div class="ls-nav-item ap"></div>
          <div class="ls-nav-item ap"></div>
          <div class="ls-nav-item ap"></div>
        </div>
      </div>
      <div class="ls-hero">
        <div class="ls-grid">
          <div class="ls-left">
            <div class="ls-h1-line ap" style="width:68%"></div>
            <div class="ls-h1-line ap" style="width:55%;background:#0ea5e9;opacity:.7"></div>
            <div class="ls-h1-line ap" style="width:62%"></div>
            <div style="display:flex;flex-direction:column;gap:6px;margin-top:6px">
              <div class="ls-p-line ap" style="width:90%"></div>
              <div class="ls-p-line ap" style="width:78%"></div>
              <div class="ls-p-line ap" style="width:62%"></div>
            </div>
            <div class="ls-badges">
              <div class="ls-badge ap"></div>
              <div class="ls-badge ap"></div>
              <div class="ls-badge ap"></div>
              <div class="ls-badge ap"></div>
            </div>
          </div>
          <div style="display:flex;justify-content:center">
            <div class="ls-card">
              <div class="ls-icon ap"></div>
              <div class="ls-card-title ap"></div>
              <div class="ls-btn ap"></div>
              <div class="ls-foot ap"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>
