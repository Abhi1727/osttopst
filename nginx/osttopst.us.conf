user nginx;
worker_processes auto;
error_log /var/log/nginx/osttopst.error.log warn;
pid /var/run/nginx-osttopst.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/osttopst.access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    client_max_body_size 2048M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript \
               application/json application/javascript application/xml+rss \
               application/rss+xml font/truetype font/opentype \
               application/vnd.ms-fontobject image/svg+xml;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=2r/s;

    # Upstream backend (ASP.NET Kestrel)
    # Make sure your backend listens on 127.0.0.1:5100 (see notes)
    upstream osttopst_backend {
        least_conn;
        server 127.0.0.1:5100 max_fails=3 fail_timeout=30s;
    }

    # Upstream frontend (Node/Express serving Vite build)
    # Make sure your frontend listens on 127.0.0.1:5101 (see notes)
    upstream osttopst_frontend {
        least_conn;
        server 127.0.0.1:5101 max_fails=3 fail_timeout=30s;


    # HTTP server (can be used directly or for certbot HTTP-01)
    server {
        listen 80;
        server_name osttopst.us www.osttopst.us;

        # Simple health check
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Security Headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # API -> backend
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://osttopst_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection keep-alive;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # Timeouts for large file uploads
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            send_timeout 300s;

            # Buffering for chunked uploads
            proxy_buffering off;
            proxy_request_buffering off;
        }

        # Frontend SPA
        location / {
            proxy_pass http://osttopst_frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # Static file caching
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://osttopst_frontend;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
